<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="style-contact.css">

    <title>Acme Support</title>
</head>
<body>
    <header>
        <p style="font-size: 32px;">Acme Support</p>

        <nav>
            <a href="#">Home</a>
            <a href="#">Help</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <main>
        <h1>Contact us</h1>
        <p>Send us a message and we will get back to you.</p>

        <form action="/submit-form" method="post">
            <div class="form-field">
                <label for="fullname">Full Name</label>
                <input 
                type="text" 
                name="fullname" 
                id="fullname"
                required
                >
            </div>
            <div class="form-field">
                <label for="email">Email</label>
                <input 
                type="email" 
                name="email" 
                id="email"
                required
                >
            </div>
            <div class="form-field">
                <label for="subject">Subject</label>
                <select name="subject" id="subject">
                    <option value="" disabled selected>Choose a topic</option>
                    <option value="topic-a">Topic A</option>
                    <option value="topic-b">Topic B</option>
                    <option value="topic-c">Topic C</option>
                </select>
            </div>
            <div class="form-field">
                <label for="message">Message</label>
                <textarea 
                name="message" 
                id="message" 
                placeholder="What's your thought?" 
                inlength="250" 
                required
                ></textarea>
            </div>
            <div class="form-field">
                <fieldset>
                    <legend>How did you hear about us?</legend>
                    <label for="search">
                        <input type="radio" name="referral" id="search">
                        Search
                    </label>

                    <label for="friend">
                        <input type="radio" name="referral" id="firend">
                        Friend
                    </label>

                    <label for="social-media">
                        <input type="radio" name="referral" id="socmed">
                        Social Media
                    </label>
                </fieldset>
            </div>
            <div class="form-field">
                <input type="checkbox" name="newslatter" id="newslatter" value="yes">
                <label for="newslatter">Send me product updates</label>
            </div>
        </form>
        <button type="submit" id="send-btn">
            Send message
        </button>
    </main>
    <footer>
        <p>&copy; 2026 Acme Support</p>
    </footer>
</body>
</html>
