<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restricted Textarea</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <script src="https://kit.fontawesome.com/a65e9443e2.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <label for="message">Write your Message</label>
        <div class="wrapper">
            <textarea id="message" maxlength="250" placeholder="What's your thought?"></textarea>
            
            <p class="counter">
                <span id="current">0</span> / 250
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
